let ENV=null; const E={rms:0,low:0,high:0,pulse:0}; let BC=0;

  for(let f=0;f<n;f++){let s=0,sl=0,sh=0;const o=f*hop;

function setLyrics(txt){

    if(/^\s*\[[a-z]+:.*\]\s*$/i.test(s))continue;

// ================= particles: "me" =================
const N=1400;

const CAM={r:0,z:1};
function drawParticles(ox,oy,col,alpha,rot,rc){
  const sz=Math.max(1.5,S*0.0045),h=sz/2;
  g.save();

// ================= "you" =================
const mouse={x:0,y:0,last:-1e9,has:false};
function onMove(cx,cy){mouse.x=(cx*dpr-W/2)/S;mouse.y=(cy*dpr-H/2)/S;mouse.last=performance.now();mouse.has=true;}

addEventListener('touchmove',e=>{const t=e.touches[0];if(t)onMove(t.clientX,t.clientY);},{passive:true});
function autoYou(t){
  const x=0.58*Math.sin(t*0.29+0.4)+0.24*Math.sin(t*0.71+2.1)+0.07*Math.sin(t*1.9);
  const y=0.40*Math.sin(t*0.37+1.3)+0.17*Math.sin(t*0.93+0.2)+0.05*Math.sin(t*2.3+1);
  return [x*Math.min(XW,1.5),y*Math.min(YH,1)*0.95];

const Y={x:0,y:0},YD={x:0,y:0}; let youA=0; const LASTYOU={x:0,y:0};
// memory of you: every position you have ever been, 20 samples per second, from 12s to 110s
const P0=12,PEND=110,PHZ=20,PN=(PEND-P0)*PHZ;
const PATHX=new Float32Array(PN),PATHY=new Float32Array(PN),PSET=new Uint8Array(PN);
function pathAt(k){k=Math.max(0,Math.min(PN-1,Math.round(k)));if(PSET[k])return[PATHX[k],PATHY[k]];return autoYou(P0+k/PHZ);}
let fourDirty=true;
function updateYou(t,dt){
  const mouseOK=(t<110||t>=188)&&mouse.has&&performance.now()-mouse.last<2500;
  if(t>=51&&t<55){const p=pathAt((51-(t-51)*9-P0)*PHZ);Y.x=p[0];Y.y=p[1];}
  else{
    let p;
    if(t>=103&&t<110)p=[0,0];
    else if(mouseOK)p=[mouse.x,mouse.y];
    else if(t>=188)p=[Math.cos(t*0.21+1)*XW*0.82,Math.sin(t*0.29+2)*YH*0.78];

  }
  if(playing&&t>=P0&&t<PEND&&!(t>=51&&t<55)&&!(t>=103)){const k=Math.floor((t-P0)*PHZ);if(k>=0&&k<PN){PATHX[k]=Y.x;PATHY[k]=Y.y;PSET[k]=1;fourDirty=true;}}
  if(t<110){LASTYOU.x=Y.x;LASTYOU.y=Y.y;}
  YD.x=Y.x;YD.y=Y.y;
  youA=t<16?0:t<16.5?ease((t-16)/0.5):t<110?1:t<188?0:t<205?1:0;
}
function drawYou(x,y,a,label,scale){
  const X=sx(x),Yy=sy(y),r=S*0.014*(scale||1);
  g.save();g.globalCompositeOperation=INV?'source-over':'lighter';
  const gr=g.createRadialGradient(X,Yy,0,X,Yy,r*5);gr.addColorStop(0,rgba(YOU,0.55*a));gr.addColorStop(1,rgba(YOU,0));
  g.fillStyle=gr;g.beginPath();g.arc(X,Yy,r*5,0,TAU);g.fill();
  g.fillStyle=INV?rgba(YOU,a):`rgba(255,215,222,${a})`;g.beginPath();g.arc(X,Yy,r*0.42,0,TAU);g.fill();
  if(label){g.globalCompositeOperation='source-over';T(label,x+0.03,y-0.03,0.024,MONO,rgba(YOU,0.8*a),'left');}
  g.restore();
}
function drawPath(prog,alpha,jit){
  const n=Math.floor(PN*clamp(prog));if(n<2)return;
  g.save();g.strokeStyle=rgba(YOU,alpha);g.lineWidth=Math.max(1,S*0.0022);g.globalCompositeOperation='lighter';g.beginPath();
  for(let k=0;k<n;k+=2){const p=pathAt(k);let x=p[0],y=p[1];if(jit){x+=(Math.random()-.5)*jit;y+=(Math.random()-.5)*jit;}k?g.lineTo(sx(x),sy(y)):g.moveTo(sx(x),sy(y));}
  g.stroke();g.restore();
}

// ================= Fourier: the algebraic expression of you =================
let FOUR=null;
function fourier(){
  if(FOUR&&!fourDirty)return FOUR;
  const M=512,zx=new Float32Array(M),zy=new Float32Array(M);
  for(let m=0;m<M;m++){const k0=Math.floor(m*PN/M),k1=Math.floor((m+1)*PN/M);let x=0,y=0;for(let k=k0;k<k1;k++){const p=pathAt(k);x+=p[0];y+=p[1];}zx[m]=x/(k1-k0);zy[m]=y/(k1-k0);}
  const terms=[];
  for(let k=-M/2;k<M/2;k++){let re=0,im=0;for(let m=0;m<M;m++){const a=-TAU*k*m/M,c=Math.cos(a),s=Math.sin(a);re+=zx[m]*c-zy[m]*s;im+=zx[m]*s+zy[m]*c;}re/=M;im/=M;terms.push({f:k,r:Math.hypot(re,im),p:Math.atan2(im,re)});}
  terms.sort((a,b)=>b.r-a.r);FOUR=terms;fourDirty=false;CURVE.key='';MARQ=null;return FOUR;
}
const FCX=new Float32Array(300),FCY=new Float32Array(300);
function chain(theta,K,scl){const F=fourier();let x=0,y=0;for(let j=0;j<K;j++){FCX[j]=x;FCY[j]=y;const a=F[j].f*theta+F[j].p;x+=F[j].r*scl*Math.cos(a);y+=F[j].r*scl*Math.sin(a);}FCX[K]=x;FCY[K]=y;}
function curvePt(theta,K,scl){const F=fourier();let x=0,y=0;for(let j=0;j<K;j++){const a=F[j].f*theta+F[j].p;x+=F[j].r*Math.cos(a);y+=F[j].r*Math.sin(a);}return[x*scl,y*scl];}
const CURVE={key:'',pts:null,box:null};
function fullCurve(K,scl){const key=K+'|'+scl.toFixed(3);if(CURVE.key!==key){const n=600,pts=new Float32Array(n*2);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(let s=0;s<n;s++){const p=curvePt(s/n*TAU,K,scl);pts[s*2]=p[0];pts[s*2+1]=p[1];x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}CURVE.key=key;CURVE.pts=pts;CURVE.box=[x0,y0,x1,y1];}return CURVE;}
let MARQ=null;
function marquee(){if(MARQ)return MARQ;const F=fourier();let s='you(t) = ';for(let j=0;j<60;j++){const tm=F[j];s+=`${tm.r.toFixed(3)}·e^i(${tm.f}t${tm.p>=0?'+':''}${tm.p.toFixed(2)})  +  `;}MARQ=s+'…';return MARQ;}
const RC={K:1,theta:0,scl:0.9};
function drawRecon(alpha,circAlpha,penLabel){

  else{const C=fullCurve(K,scl).pts;for(let s=0;s<C.length;s+=2){s?g.lineTo(sx(C[s]),sy(C[s+1])):g.moveTo(sx(C[s]),sy(C[s+1]));}g.closePath();}

let CUMK=-1;const CUM=new Float32Array(64);

// ================= shapes sampled from glyphs =================
function sampleShape(str,fam,colored,weight){

    const mq=marquee();g.font=`${0.024*S}px ${MONO}`;const mw=g.measureText(mq).width;g.textAlign='left';g.textBaseline='middle';g.fillStyle=rgba(ME,0.45);g.fillText(mq,W-((lt*0.3*S)%(mw+W)),sy(-YH+0.11));
    if(t>=181){let left=Math.floor((t-181)*34);const x=XW<1.3?-XW+0.06:XW-1.02;for(let k=0;k<QA.length&&left>0;k++){const s=QA[k].slice(0,left);left-=QA[k].length+8;T(s+(k===QA.length-1&&Math.floor(t*2)%2?'▍':''),x,0.47+k*0.04,0.024,MONO,rgba(k%2?YOU:ME,0.8),'left');}}
    if(t>=184)T('love(t) = Σ cₖ eⁱᵏᵗ',0,-YH+0.24,0.075,SERIF,rgba(ME,0.95*ease((t-184)/0.6)),'center','italic');}});
// ---- 3:08 you are free. I am trapped ----
scene(188,{K:200,D:20,
  pre(t){reconPre(200,(t-162)*0.42,0.78-0.4*ease((t-190)/14));},
  target(i){if(i%5<3){circleTarget(i);return;}const C=fullCurve(RC.K,RC.scl).box,m=0.08,x0=C[0]-m,y0=C[1]-m,x1=C[2]+m,y1=C[3]+m;
    let x=clamp(YD.x+(R1[i]-.5)*0.3,x0,x1),y=clamp(YD.y+(R2[i]-.5)*0.3,y0,y1);const dl=x-x0,dr=x1-x,dt=y-y0,db=y1-y,mn=Math.min(dl,dr,dt,db);
    if(mn===dl)x=x0;else if(mn===dr)x=x1;else if(mn===dt)y=y0;else y=y1;tx=x+(Math.random()-.5)*0.006;ty=y+(Math.random()-.5)*0.006;},
  meA:()=>0.7,
  draw(t,lt){drawRecon(0.8,0.1,'love(t)');const C=fullCurve(RC.K,RC.scl).box,m=0.08;g.strokeStyle=rgba(ME,0.75);g.lineWidth=Math.max(1,S*0.0025);g.strokeRect(sx(C[0]-m),sy(C[1]-m),(C[2]-C[0]+2*m)*S,(C[3]-C[1]+2*m)*S);
    drawYou(YD.x,YD.y,1,'you');},
  post(t){if(t>199){g.fillStyle=`rgba(6,6,8,${0.55*ease((t-199)/6)})`;g.fillRect(0,0,W,H);}}});
// ---- 3:25 execution ----
scene(205,{K:30,D:8,cap:false,hud:false,log:false,
  target(i){tx=0;ty=0;},
  vis(i,t,lt){return lt<1.3||i===0;},
  meA:(t,lt)=>lt<1.6?1:0,
  draw(t,lt){if(lt<0.6){g.fillStyle=`rgba(255,255,255,${1-lt/0.6})`;g.fillRect(0,0,W,H);}
    if(lt>=1.6&&lt<5.5){const s='world.execute(me);';T(s.slice(0,Math.floor((lt-1.6)*14)),0,-0.08,0.032,MONO,rgba(ME,0.7*(1-ease((lt-4.5)/1))));}
    if(lt>=1.6&&Math.floor(performance.now()/530)%2===0)T('▍',0,0,0.045,MONO,rgba(ME,0.9));}});
for(let k=0;k<SC.length;k++)SC[k].t1=k+1<SC.length?SC[k+1].t0:999;
function sceneAt(t){for(let k=SC.length-1;k>=0;k--)if(t>=SC[k].t0)return SC[k];return SC[0];}

// ================= captions / HUD =================
function drawCaptions(t,sc){
  const i=lyrIndex(t);if(i<0)return;const fg=INV?INK:ME;
  if(sc.log!==false){const fs=0.024,narrow=XW<1.3,x0=-XW+0.06,yb=narrow?-YH+0.12+6*fs*1.6:YH-0.07;
    g.font=`${fs*S}px ${MONO}`;g.textAlign='left';g.textBaseline='alphabetic';
    for(let j=Math.max(0,i-6);j<=i;j++){const L=LYR[j],back=i-j;let s=L[2];if(j===i)s=s.slice(0,Math.floor((t-L[0])*45));
      const a=j===i?0.85:0.3*(1-back/7),y=sy(yb-back*fs*1.6);g.fillStyle=rgba(fg,a*0.5);g.fillText(String(j+1).padStart(3,' '),sx(x0),y);g.fillStyle=rgba(fg,a);g.fillText(s,sx(x0+fs*2.4),y);}}
  if(sc.cap!==false){const L=LYR[i],nt=i+1<LYR.length?LYR[i+1][0]:L[0]+4,dur=Math.min(nt-L[0],4.5),lt=t-L[0];
    if(lt<dur){const rev=Math.min(1,lt/Math.min(0.55,dur*0.45)),s=L[1].slice(0,Math.ceil(L[1].length*rev)),a=Math.min(1,(dur-lt)/0.35);
      T(s,0,YH-0.2,0.054,SERIF,rgba(fg,0.92*a),'center','italic');}}
}
function drawHUD(t,sc){const you=t<16?'null':t>=110&&t<188?'undefined':`(${fmt(Y.x)}, ${fmt(-Y.y)})`;const n=sc.alive?sc.alive(t):N;
  T(`world.execute(me)    t=${t.toFixed(2).padStart(6,'0')}    me[${n}]    you=${you}`,-XW+0.06,-YH+0.05,0.02,MONO,rgba(INV?INK:ME,0.32),'left','','top');}

// ================= frame =================
let curScene=null;
function frame(t,dt){
  const sc=sceneAt(t),lt=t-sc.t0,u=clamp(lt/(sc.t1-sc.t0));
  if(sc!==curScene){curScene=sc;sc.enter&&sc.enter(t);}
  envAt(t);BC=beatCount(t);updateYou(t,dt);
  INV=sc.inv?sc.inv(t,lt,u):false;CAM.r=0;CAM.z=1;meA=sc.meA?sc.meA(t,lt,u):1;PCOL=sc.colors?sc.colors():null;BLEND=sc.blend||'lighter';
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';
  const tr=sc.trail||0;g.fillStyle=INV?`rgba(238,234,226,${1-tr})`:`rgba(6,6,8,${1-tr})`;g.fillRect(0,0,W,H);
  g.save();
  sc.pre&&sc.pre(t,lt,u);applyCam();
  if(sc.phys)sc.phys(dt,t,lt,u);
  else if(sc.target){
    if(sc.snap){for(let i=0;i<N;i++){sc.target(i,t,lt,u);PX[i]=tx;PY[i]=ty;VX[i]=VY[i]=0;}}
    else{const K=sc.K||60,D=sc.D||12;for(let i=0;i<N;i++){sc.target(i,t,lt,u);const ax=(tx-PX[i])*K-VX[i]*D,ay=(ty-PY[i])*K-VY[i]*D;VX[i]+=ax*dt;VY[i]+=ay*dt;PX[i]+=VX[i]*dt;PY[i]+=VY[i]*dt;}}
  }
  for(let i=0;i<N;i++)VIS[i]=sc.vis?(sc.vis(i,t,lt,u)?1:0):1;
  if(meA>0)drawParticles(0,0,null,meA);
  if(youA>0&&t<188)drawYou(YD.x,YD.y,youA);
  sc.draw&&sc.draw(t,lt,u);
  g.restore();
  drawCaptions(t,sc);
  if(sc.hud!==false&&t>5)drawHUD(t,sc);
  sc.post&&sc.post(t,lt,u);
}

// ================= boot =================
const gate=document.getElementById('gate'),gs=document.getElementById('gs'),ui=document.getElementById('ui'),bar=document.getElementById('bar');
const params=new URLSearchParams(location.search);const STILL=params.has('t')?parseFloat(params.get('t')):null;
let lastT=0,lastWall=0,cursorShown=null;
function loop(){
  requestAnimationFrame(loop);
  const t=now();let dt=t-lastT;if(dt<0||dt>0.5)dt=0;dt=Math.min(dt,1/30);lastT=t;
  frame(t,dt);
  bar.style.width=(t/DUR*100)+'%';
  const want=!playing||(t>=188&&t<205);if(want!==cursorShown){cursorShown=want;cv.style.cursor=want?'default':'none';}
}
async function getAudio(){
  if(AUDIO_B64.length>100){const bin=atob(AUDIO_B64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return u8.buffer;}
  try{const r=await fetch(AUDIO_URL);if(!r.ok)throw 0;return await r.arrayBuffer();}catch(e){return null;}
}
async function getLyrics(){
  if(!LYRICS_EMB.startsWith('%%'))return LYRICS_EMB;
  try{const r=await fetch(LYRICS_URL);if(!r.ok)throw 0;return await r.text();}catch(e){return null;}
}
async function useAudio(ab){
  gs.textContent='decoding…';
  abuf=await actx.decodeAudioData(ab);DUR=abuf.duration;analyse(abuf);
  gs.innerHTML='[ click to execute ]';ready=true;
}
let ready=false,started=false;
async function boot(){
  actx=new (window.AudioContext||window.webkitAudioContext)();analyser=actx.createAnalyser();analyser.fftSize=2048;analyser.connect(actx.destination);
  buildShapes();
  if(STILL!==null&&params.has('mute')){still(STILL);return;}
  const ly=await getLyrics();if(ly)setLyrics(ly);
  const ab=await getAudio();
  if(!ab){gs.textContent='drop the song (mp3) here · 把 world.execute(me).mp3 拖進這個視窗';if(STILL!==null)still(STILL);return;}
  try{await useAudio(ab);}catch(e){gs.textContent='decode failed: '+e;}
  if(STILL!==null)still(STILL);
}
function still(t0){ // debug: simulate up to t0 without sound, then freeze
  gate.style.display='none';offset=Math.max(0,t0-4);playing=false;
  for(let k=0;k<240;k++){offset+=1/60;lastT=offset;frame(offset,1/60);}
  offset=t0;frame(t0,1/60);document.title='ok '+t0;
  const hold=()=>{frame(t0,0);requestAnimationFrame(hold);};requestAnimationFrame(hold);
}
gate.addEventListener('click',async()=>{if(!ready||started)return;started=true;await actx.resume();gate.style.display='none';play(0);lastT=0;requestAnimationFrame(loop);});
addEventListener('keydown',e=>{if(!started)return;
  if(e.code==='Space'){e.preventDefault();playing?pause():play(offset>=DUR-0.1?0:offset);}
  else if(e.code==='ArrowRight')seek(now()+5);else if(e.code==='ArrowLeft')seek(now()-5);
  else if(e.code==='KeyF'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}});
ui.addEventListener('click',e=>seek(e.clientX/innerWidth*DUR));
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{e.preventDefault();
  for(const f of e.dataTransfer.files){
    if(/\.(txt|lrc)$/i.test(f.name)){setLyrics(await f.text());continue;}
    try{await useAudio(await f.arrayBuffer());}catch(err){gs.textContent='decode failed: '+err;}}});
addEventListener('error',e=>{document.title='ERR '+e.message;});
boot();
</script>
